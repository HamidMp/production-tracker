services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # App config comes from .env (created from .env.example on first start). It is not
    # set here on purpose: real environment variables would override phpunit.xml and
    # make the tests run against the dev database.
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 5
      # The first start runs composer install, which can take a while.
      start_period: 5m

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # just start the worker.
    entrypoint: ["php", "artisan", "queue:work", "--tries=3"]
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: production_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/create-testing-db.sql:/docker-entrypoint-initdb.d/create-testing-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d production_tracker"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
